# Publishes to npm with a provenance statement on every version tag (e.g. 0.5.0).
# n8n requires this for verified community nodes since May 1 2026.
#
# Auth: npm Trusted Publishing (OIDC). On npmjs.com, n8n-nodes-chat33 →
# Settings → Trusted Publishers → GitHub Actions: owner chat33-io, repository
# n8n-nodes-chat33, workflow publish.yml. No NPM_TOKEN secret is needed.

name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing needs npm 11.5.1 or later.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Release
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
